<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <title>Empleados</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <span class="navbar-brand">
            Gestión de Empleados
        </span>

        <div class="d-flex align-items-center">

            <span class="text-light me-3" th:text="${usuarioActual}"></span>

            <form
                th:action="@{/logout}"
                method="post"
            >

                <input
                    type="hidden"
                    th:if="${_csrf}"
                    th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}"
                >

                <button
                    type="submit"
                    class="btn btn-outline-light btn-sm"
                >
                    Cerrar sesión
                </button>

            </form>

        </div>

    </div>

</nav>


<div class="container py-5">

    <div
        th:if="${mensaje}"
        class="alert alert-success"
        th:text="${mensaje}"
    ></div>

    <div
        class="d-flex
               justify-content-between
               align-items-center
               mb-4"
    >

        <h1>Empleados</h1>

        <a
            class="btn btn-primary"
            th:href="@{/admin/empleados/nuevo}"
        >
            Nuevo empleado
        </a>

    </div>


    <table class="table table-striped table-hover">

        <thead>

        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Estado</th>
            <th>Fecha registro</th>
            <th>Acciones</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="empleado : ${empleados}">

            <td th:text="${empleado.id}"></td>

            <td th:text="${empleado.nombre}"></td>

            <td th:text="${empleado.email}"></td>

            <td th:text="${empleado.rol}"></td>

            <td th:text="${empleado.estado}"></td>

            <td th:text="${#temporals.format(empleado.fechaRegistro, 'dd/MM/yyyy HH:mm')}"></td>

            <td>

                <a
                    class="btn btn-warning btn-sm"
                    th:href="@{/admin/empleados/{id}/editar(id=${empleado.id})}"
                >
                    Editar
                </a>

                <form
                    th:if="${esAdmin}"
                    th:action="@{/admin/empleados/{id}/eliminar(id=${empleado.id})}"
                    method="post"
                    style="display:inline"
                >

                    <input
                        type="hidden"
                        th:if="${_csrf}"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}"
                    >

                    <button
                        type="submit"
                        class="btn btn-danger btn-sm"
                        onclick="return confirm('¿Desea eliminar el empleado?')"
                    >
                        Eliminar
                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>


    <div
        th:if="${#lists.isEmpty(empleados)}"
        class="alert alert-info"
    >
        No existen empleados registrados.
    </div>

</div>

</body>

</html>
