<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <title>Empleado</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container py-5" style="max-width: 600px;">

    <h1
        th:text="${empleado.id == null}
        ? 'Nuevo empleado'
        : 'Editar empleado'"
    ></h1>

    <div
        th:if="${error}"
        class="alert alert-danger"
        th:text="${error}"
    ></div>

    <form
        th:object="${empleado}"
        th:action="${empleado.id == null}
            ? @{/admin/empleados}
            : @{/admin/empleados/{id}(id=${empleado.id})}"
        method="post"
    >

        <input
            type="hidden"
            th:if="${_csrf}"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}"
        >

        <div class="mb-3">

            <label class="form-label">
                Nombre
            </label>

            <input
                type="text"
                class="form-control"
                th:field="*{nombre}"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Email
            </label>

            <input
                type="email"
                class="form-control"
                th:field="*{email}"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Rol
            </label>

            <select
                class="form-select"
                th:field="*{rol}"
                required
            >

                <option value="">Seleccione...</option>

                <option
                    th:each="r : ${roles}"
                    th:value="${r}"
                    th:text="${r}"
                ></option>

            </select>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Estado
            </label>

            <select
                class="form-select"
                th:field="*{estado}"
                required
            >

                <option
                    th:each="e : ${estados}"
                    th:value="${e}"
                    th:text="${e}"
                ></option>

            </select>

        </div>


        <div class="mb-3" th:if="${empleado.id == null}">

            <label class="form-label">
                Contraseña
            </label>

            <input
                type="password"
                class="form-control"
                th:field="*{password}"
                required
            >

        </div>


        <div class="mb-3" th:if="${empleado.id != null}">

            <label class="form-label">
                Nueva contraseña
            </label>

            <input
                type="password"
                name="nuevaPassword"
                class="form-control"
                placeholder="Dejar en blanco para no cambiar"
            >

        </div>


        <button
            type="submit"
            class="btn btn-success"
        >
            Guardar
        </button>

        <a
            class="btn btn-secondary"
            th:href="@{/admin/empleados}"
        >
            Cancelar
        </a>

    </form>

</div>

</body>

</html>
